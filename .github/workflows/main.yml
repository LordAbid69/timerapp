name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish a GitHub Release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle 8.7 itself, so no gradle-wrapper.jar is required in the repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Generates the Gradle files and builds the Android folder layout from the flat repo.
      - name: Prepare project
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Timer"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.caching=true
          org.gradle.parallel=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.timer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.timer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      // Debug-signed so the release APK is installable. Replace with your own keystore for Play Store.
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.4")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          EOF
          echo '# default rules' > app/proguard-rules.pro
          mkdir -p app/src/main/java/com/example/timer/ui
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv Fmt.kt MainActivity.kt Sounds.kt TimerService.kt TimerStore.kt app/src/main/java/com/example/timer/
          mv Theme.kt TimerScreen.kt WheelPicker.kt app/src/main/java/com/example/timer/ui/
          mv strings.xml themes.xml colors.xml app/src/main/res/values/
          mv ic_timer.xml ic_bell.xml ic_launcher_foreground.xml app/src/main/res/drawable/
          mv ic_launcher.xml ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/
          echo "---- project layout ----"
          find . -path ./.git -prune -o -type f -print | sort
          gradle projects --no-daemon

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Timer-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Timer-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
